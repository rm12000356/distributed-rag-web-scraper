services:
  postgres:
    image: postgres:16
    container_name: rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: ragdb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d ragdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rag-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 5

  qdrant:
    image: qdrant/qdrant
    container_name: rag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: rag-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://rag:rag@postgres:5432/ragdb"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672"
      QDRANT_URL: "http://qdrant:6333"
      EMBEDDING_DIMENSIONS: "384"
      CORS_ORIGIN: "*"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      OPENAI_LLM_MODEL: "${OPENAI_LLM_MODEL:-gpt-4o-mini}"
      OPENAI_EMBEDDING_MODEL: "${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"

  worker-1:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: rag-worker-1
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://rag:rag@postgres:5432/ragdb"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672"
      QDRANT_URL: "http://qdrant:6333"
      EMBEDDING_DIMENSIONS: "384"
      WORKER_NAME: "worker-1"
      WORKER_HEALTH_PORT: "3001"
      PROCESSING_WORKER_ENABLED: "true"
      PROCESSING_PREFETCH: "1"
      CRAWL_MAX_ATTEMPTS: "5"
      MAX_CHILD_LINKS: "50"
      HEARTBEAT_INTERVAL_MS: "30000"
      RECONCILE_INTERVAL_MS: "300000"
      RECONCILE_STALE_MS: "900000"
      EMBED_BATCH_SIZE: "16"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      OPENAI_LLM_MODEL: "${OPENAI_LLM_MODEL:-gpt-4o-mini}"
      OPENAI_EMBEDDING_MODEL: "${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"

volumes:
  postgres_data:
  qdrant_data:
